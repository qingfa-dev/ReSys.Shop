[project]
name = "benchmark"
version = "0.1.0"
description = "One-shot model comparison for fashion product retrieval (Resys.FashionShop thesis)"
requires-python = ">=3.12"
dependencies = [
    # ML / vision
    "torch>=2.3",
    "torchvision>=0.18",
    "transformers>=4.41",
    "open-clip-torch>=2.24",
    "fashion-clip>=0.2",
    # Data
    "numpy>=1.26",
    "Pillow>=10.3",
    # Retrieval
    "faiss-cpu>=1.8",
    "httpx>=0.24.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2",
    # Config / validation
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    # CLI / progress
    "rich>=13.7",
    "typer>=0.12",
    "tqdm>=4.66",
    # System / monitoring
    "psutil>=6.0",
    # Reporting / charts
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pandas>=2.2",
    "kagglehub>=1.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "testcontainers[postgres]>=4.0",
]

[project.scripts]
benchmark = "benchmark.cli.benchmark:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benchmark"]

[tool.pytest.ini_options]
testpaths  = ["src/tests"]
pythonpath = ["src", "."]
addopts    = "-v --tb=short"

[tool.ruff]
line-length    = 100
target-version = "py312"
src            = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
