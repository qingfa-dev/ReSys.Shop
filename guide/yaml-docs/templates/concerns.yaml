kind: BuildingBlockModule
id: concerns-name-concerns
name: Namespace.Concerns
version: "1.0.0"
status: stable
schema_version: "2.0"

meta:
  name: ConcernsName Concerns Building Block
  description: >
    Provides composable [entity/service/infrastructure] behaviors through interfaces,
    static behavior classes, and constant definitions.
    Each concern follows the Interface + Behavior + Constants pattern for independent
    implementation across [entities/components].
  category: Cross-Cutting Concerns & Behaviors
  stability: Stable
  standards_alignment: "SOLID Principles, Single Responsibility, Composition over Inheritance"
  dependencies:
    - name: Framework
      version: "x.x"
    # Add dependencies as required by specific concerns

principles:
  - id: P1
    name: Single Responsibility
    description: Each concern encapsulates exactly one behavior without mixing concerns.
    rationale: Follows SRP — allows selective, independent application of behaviors.

  - id: P2
    name: Composition over Inheritance
    description: >
      Entities/Components compose behaviors through interfaces rather than inheritance chains.
    rationale: Enables flexible mixing of concerns without deep, brittle hierarchies.

  - id: P3
    name: Explicit Contract
    description: Each concern defines a clear interface contract with required members.
    rationale: >
      Provides type-safe guarantees and enables framework interceptor integration.

  - id: P4
    name: Interface + Behavior + Constants
    description: >
      Every concern ships three artifacts: an interface (contract), a static Behavior class
      (logic), and a Constants class (constraints and metadata).
    rationale: >
      Prevents scattered magic values and logic, keeping concerns fully self-contained.

features:
  - id: F1
    name: ConcernName
    type: core
    description: What this concern provides and when to use it.
    api_highlight: "IConcernName { Property: type }"
  - id: F2
    name: ConcernName2
    type: core
    description: ...
    api_highlight: "IConcernName2 { Property1, Property2 }"
  # Add F3, F4 ... for each concern

abstractions:
  # One category per concern
  - category: ConcernName Concern
    order: 1
    description: >
      Two sentences: what behavior does this concern add, and when would you implement it?
    items:
      # Interface
      - id: A1
        name: IConcernName
        type: interface
        path: ./ConcernName/ConcernName.cs
        description: >
          Interface for entities/components requiring [concern capability].
        purpose: >
          Why you'd implement this: what does implementing it unlock?
          What framework or tooling integration does it enable?
        contract: |
          public interface IConcernName {
            PropertyType PropertyName { get; set; }
            // Contract: post=PropertyName is set by interceptor/behavior on trigger
          }
        top_use: Most common entity or component that implements this.
        example: |
          public class EntityName : Entity, IConcernName {
            public PropertyType PropertyName { get; set; }
          }

      # Static Behavior class
      - id: A2
        name: ConcernNameBehavior
        type: class
        path: ./ConcernName/ConcernName.Behavior.cs
        description: >
          Static behavior class providing [concern] operations.
          Always use these methods instead of setting properties directly.
        purpose: >
          Centralizes [concern] logic, ensuring consistent behavior and
          preventing partial state updates.
        methods:
          - name: "Apply(IConcernName, param: type)"
            description: What it does
          - name: "Apply2(IConcernName, param: type, param2: type)"
            description: ...
          # Add more methods as needed

      # Constants class
      - id: A3
        name: ConcernNameConstant
        type: class
        path: ./ConcernName/ConcernName.Constant.cs
        description: >
          Contains constraints (max lengths, defaults), field metadata,
          and configuration values for ConcernName properties.
        purpose: >
          Single source of truth for ConcernName constraints.
          Reference instead of hardcoding values.

  - category: ConcernName2 Concern
    order: 2
    description: ...
    items:
      - id: B1
        name: IConcernName2
        type: interface
        path: ./ConcernName2/ConcernName2.cs
        description: ...
        purpose: ...
        contract: |
          public interface IConcernName2 {
            PropertyType Property1 { get; set; }
            PropertyType Property2 { get; set; }
          }

      - id: B2
        name: ConcernName2Behavior
        type: class
        path: ./ConcernName2/ConcernName2.Behavior.cs
        description: ...
        purpose: ...
        methods:
          - name: "Method(IConcernName2)"
            description: What it does

      - id: B3
        name: ConcernName2Constant
        type: class
        path: ./ConcernName2/ConcernName2.Constant.cs
        description: ...
        purpose: ...

  # Add more categories (C-prefix IDs) per additional concern

technical:
  mechanisms:
    - id: M1
      name: Concern Composition
      scope: Entity implementation pattern
      pattern: |
        // Entities compose multiple concerns simultaneously
        public class EntityName : Entity, IEntity,
                                  IConcern1, IConcern2, IConcern3 {
          // Concern properties
          public Type Prop1 { get; set; }
          public Type Prop2 { get; set; }
        }

    - id: M2
      name: Framework Interceptor Integration
      scope: Automatic concern handling on persistence
      description: >
        Concerns integrate with EF Core / ORM through interceptors/hooks
        that automatically apply behavior on SaveChanges / flush / commit.
      steps:
        - Implement IConcernName on entity
        - Register InterceptorName in DbContext / SessionFactory
        - Interceptor detects interface and applies Behavior automatically

anti_patterns:
  - id: AP1
    name: Concern Overlap
    severity: high
    avoid: Implementing multiple concerns that provide similar functionality.
    better_approach: >
      Use standard concern interfaces exclusively. Extend only with explicit rationale.

  - id: AP2
    name: Behavior Bypass
    severity: medium
    avoid: Directly modifying concern properties instead of using Behavior classes.
    bad_example: "❌ entity.IsDeleted = true;"
    better_approach: Use Behavior static methods for consistent logic.
    good_example: "✅ ConcernNameBehavior.Method(entity);"

  - id: AP3
    name: Hardcoded Constraint Values
    severity: medium
    avoid: Using magic numbers instead of Constant classes.
    bad_example: "❌ if (slug.Length > 255)"
    better_approach: Reference the Constant class.
    good_example: "✅ if (slug.Length > ConcernNameConstant.Constraints.MaxLength)"

usage:
  scenarios:
    - id: S1
      title: Entity with Multiple Concerns
      context: Creating a fully-featured entity requiring several cross-cutting behaviors.
      pattern: |
        public class EntityName : Entity, IEntity,
                                  IConcern1, IConcern2, IConcern3 {
          // Concern 1 properties
          public Type1 Prop1 { get; set; }

          // Concern 2 properties
          public Type2 Prop2 { get; set; }
          public Type2b Prop2b { get; set; }

          // Concern 3 properties
          public Type3 Prop3 { get; set; }
        }
      benefits:
        - Standardized behavior across all entities
        - Interceptor integration for automatic handling
        - No behavior logic scattered in entity bodies

    - id: S2
      title: Applying a Concern via Behavior
      context: Explicitly applying a concern behavior in domain logic.
      pattern: |
        // In a domain method or application service:
        ConcernNameBehavior.Method(entity, additionalParam);
      benefits:
        - Consistent logic path regardless of caller
        - Testable in isolation

testing:
  strategies:
    - id: TS1
      title: Interface Implementation Verification
      objective: Verify entity correctly implements concern interface.
      code_example: |
        [Fact]
        public void EntityName_Implements_IConcernName() {
          var entity = new EntityName();
          Assert.IsAssignableFrom<IConcernName>(entity);
        }

    - id: TS2
      title: Behavior Method Testing
      objective: Verify Behavior methods correctly update concern properties.
      code_example: |
        [Fact]
        public void ConcernNameBehavior_Method_UpdatesProperty() {
          var entity = new TestEntity();
          ConcernNameBehavior.Method(entity);

          Assert.NotNull(entity.Property);
          Assert.Equal(ExpectedValue, entity.Property);
        }

file_structure: |
  ConcernsModuleName/
  ├── ConcernName/
  │   ├── ConcernName.cs              # IConcernName interface
  │   ├── ConcernName.Behavior.cs     # ConcernNameBehavior static class
  │   ├── ConcernName.Constant.cs     # Constraints and defaults
  │   ├── ConcernName.Validations.cs  # Validation rules (if needed)
  │   └── ConcernName.Result.cs       # Result types (if needed)
  ├── ConcernName2/
  │   ├── ConcernName2.cs
  │   ├── ConcernName2.Behavior.cs
  │   └── ConcernName2.Constant.cs
  └── README.yaml                     # This documentation
