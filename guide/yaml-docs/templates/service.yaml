  ServiceName/
  ├── API/
  │   ├── Endpoints/                    # Minimal API endpoint definitions
  │   └── Middleware/                   # Service-specific middleware
  ├── Application/
  │   ├── Commands/
  │   │   ├── CreateXxx/
  │   │   │   ├── CreateXxxCommand.cs
  │   │   │   ├── CreateXxxHandler.cs
  │   │   │   └── CreateXxxValidator.cs
  │   │   └── UpdateXxx/
  │   ├── Queries/
  │   │   ├── GetXxxById/
  │   │   └── ListXxx/
  │   └── DTOs/                         # Response data transfer objects
  ├── Domain/
  │   ├── Xxx.cs                        # Aggregate root
  │   ├── Events/                       # Domain events
  │   └── Rules/                        # IBusinessRule implementations
  ├── Infrastructure/
  │   ├── Persistence/
  │   │   ├── ServiceNameDbContext.cs
  │   │   ├── Configurations/           # EF Core entity configurations
  │   │   └── Repositories/             # Repository implementations
  │   └── Messaging/
  │       ├── Publishers/               # Integration event publishers
  │       └── Consumers/                # Integration event consumers
  └── README.yaml                       # This documentation
