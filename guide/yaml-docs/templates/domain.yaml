    author: "Evans, Eric"
    title: "Domain-Driven Design: Tackling Complexity in the Heart of Software"
    year: 2003
    relevance: "Foundational text; defines Entity, Value Object, Aggregate, Domain Event."
  - id: R2
    author: "Fowler, Martin"
    title: Patterns of Enterprise Application Architecture
    year: 2002
    relevance: "Repository pattern, Unit of Work, and Layer Supertype."
  - id: R3
    author: "Vernon, Vaughn"
    title: Implementing Domain-Driven Design
    year: 2013
    relevance: "Practical aggregate design, domain event publishing, bounded contexts."

file_structure: |
  Domain/
  ├── Abstracts/
  │   ├── IEntity.cs                    # Entity identity marker
  │   ├── IAggregateRoot.cs             # Aggregate root marker
  │   ├── IBusinessRule.cs              # Business rule contract
  │   ├── IAuditable.cs                 # Audit trail marker
  │   ├── ISoftDeleted.cs               # Soft-delete marker
  │   ├── IHasVersion.cs                # Optimistic concurrency marker
  │   └── IHasDomainEvent.cs            # Domain event collection marker
  ├── Models/
  │   ├── Entity.cs                     # Abstract entity base
  │   ├── AggregateRoot.cs              # Abstract aggregate root base
  │   └── ValueObject.cs                # Abstract value object base
  ├── Exceptions/
  │   ├── DomainException.cs            # Base domain exception
  │   └── BusinessRuleViolatedException.cs  # Thrown by CheckRule()
  └── README.yaml                       # This documentation
