version: "1.0"
name: "ReSys.Shop"
created: "2026-07-11"
updated: "2026-07-11"
tech_stack:
  languages:
    - csharp
    - typescript
    - python
  frameworks:
    - aspnet-core-10
    - ef-core-10
    - vue-3
    - fastapi
  build:
    - dotnet
    - pnpm
    - uv
  test:
    - xunit-v3
    - vitest
    - pytest
  lint:
    - editorconfig
    - oxlint
    - ruff
    - eslint
harness_components:
  - knowledge
  - architecture
  - enforcement
  - quality
escalation:
  autonomous:
    - single_domain_changes
    - doc_corrections
    - dependency_bumps
    - refactoring
    - review_response
  notify:
    - cross_domain_changes
    - new_dependencies
    - performance_sensitive
    - harness_config_changes
  human_required:
    - public_api_changes
    - security_changes
    - architectural_changes
    - feature_deprecation
    - escalation_boundary_changes
