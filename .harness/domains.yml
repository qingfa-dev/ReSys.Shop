version: "1.0"

layer_order:
  - types
  - config
  - domain
  - persistence
  - features
  - api
  - ui

dependency_rule: forward_only

cross_cutting:
  - name: persistence
    description: EF Core DbContext, migrations, query specifications, seeders
    entry_point: Shared.Operational.Persistence
    path: service/Api/src/Shared/Operational/Persistence
  - name: auth
    description: JWT authentication, ASP.NET Identity, permission-based authorization
    entry_point: Shared.Security
    path: service/Api/src/Shared/Security
  - name: observability
    description: OpenTelemetry, structured logging, correlation IDs, health checks
    entry_point: Shared.Observability
    path: service/Api/src/Shared/Observability
  - name: caching
    description: HybridCache + Redis multi-tier caching
    entry_point: Shared.Performance.Caching
    path: service/Api/src/Shared/Performance/Caching
  - name: storage
    description: File storage abstraction (Local, S3, Azure), malware scanning, image processing
    entry_point: Shared.Operational.Storages
    path: service/Api/src/Shared/Operational/Storages
  - name: notifications
    description: Email (SendGrid/SMTP) and SMS (Sinch) notification infrastructure
    entry_point: Shared.Operational.Notifications
    path: service/Api/src/Shared/Operational/Notifications
  - name: background_jobs
    description: Hangfire background job processing
    entry_point: Shared.Operational.Backgrounds
    path: service/Api/src/Shared/Operational/Backgrounds
  - name: api_governance
    description: OpenAPI/Scalar docs, JSON conventions, FluentValidation registration
    entry_point: Shared.Governance
    path: service/Api/src/Shared/Governance

domains:
  - name: Catalog
    description: Product catalog — products, variants, prices, images, taxonomies, option types, classifications
    path: service/Api/src/Module/Catalog
    layers:
      types: service/Api/src/Module/Catalog/Domain
      config: service/Api/src/Module/Catalog/Catalog.Extension.cs
      domain: service/Api/src/Module/Catalog/Domain
      persistence: service/Api/src/Module/Catalog/Persistence
      features: service/Api/src/Module/Catalog/Features
    providers:
      - persistence
      - auth
      - observability
      - caching
      - storage
    size_loc: 19934

  - name: Inventory
    description: Inventory management — stock locations, stock items, reservations, transfers
    path: service/Api/src/Module/Inventory
    layers:
      types: service/Api/src/Module/Inventory/Domain
      config: service/Api/src/Module/Inventory/Inventory.Extension.cs
      domain: service/Api/src/Module/Inventory/Domain
      persistence: service/Api/src/Module/Inventory/Persistence
      features: service/Api/src/Module/Inventory/Features
    providers:
      - persistence
      - auth
      - observability
      - caching
    size_loc: 7416

  - name: Identity
    description: User authentication and authorization — users, roles, permissions, sessions
    path: service/Api/src/Module/Identity
    layers:
      config: service/Api/src/Module/Identity/Identity.Extensions.cs
      features: service/Api/src/Module/Identity/Features
    providers:
      - auth
      - persistence
      - observability
    size_loc: 6468

  - name: Location
    description: Geographic data — countries, states/provinces lookup
    path: service/Api/src/Module/Location
    layers:
      types: service/Api/src/Module/Location/Domain
      config: service/Api/src/Module/Location/Locations.Extensions.cs
      domain: service/Api/src/Module/Location/Domain
      persistence: service/Api/src/Module/Location/Persistence
      features: service/Api/src/Module/Location/Features
    providers:
      - persistence
      - observability
    size_loc: 3056

  - name: Ordering
    description: Order management — cart, checkout, orders, line items, adjustments, order events
    path: service/Api/src/Module/Ordering
    layers:
      types: service/Api/src/Module/Ordering/Domain
      config: service/Api/src/Module/Ordering/Ordering.Extension.cs
      domain: service/Api/src/Module/Ordering/Domain
      persistence: service/Api/src/Module/Ordering/Persistence
      features: service/Api/src/Module/Ordering/Features
    providers:
      - persistence
      - auth
      - observability
      - caching
    size_loc: 6577

  - name: Payment
    description: Payment processing — payment intents, methods, refunds, gateway integration, webhooks
    path: service/Api/src/Module/Payment
    layers:
      types: service/Api/src/Module/Payment/Domain
      config: service/Api/src/Module/Payment/Payment.Extension.cs
      domain: service/Api/src/Module/Payment/Domain
      persistence: service/Api/src/Module/Payment/Persistence
      features: service/Api/src/Module/Payment/Features
    providers:
      - persistence
      - auth
      - observability
    size_loc: 4925

  - name: Profile
    description: User profiles — addresses, wishlists, notification preferences
    path: service/Api/src/Module/Profile
    layers:
      types: service/Api/src/Module/Profile/Domain
      config: service/Api/src/Module/Profile/Profiles.Extensions.cs
      domain: service/Api/src/Module/Profile/Domain
      persistence: service/Api/src/Module/Profile/Persistence
      features: service/Api/src/Module/Profile/Features
    providers:
      - persistence
      - auth
      - observability
    size_loc: 5864

  - name: Shipping
    description: Shipping configuration — shipping methods, rates, calculators
    path: service/Api/src/Module/Shipping
    layers:
      types: service/Api/src/Module/Shipping/Domain
      config: service/Api/src/Module/Shipping/Shipping.Extension.cs
      domain: service/Api/src/Module/Shipping/Domain
      persistence: service/Api/src/Module/Shipping/Persistence
      features: service/Api/src/Module/Shipping/Features
    providers:
      - persistence
      - auth
      - observability
    size_loc: 2901

  - name: Shared.Infrastructure
    description: Cross-cutting infrastructure backbone — persistence, auth, caching, storage, notifications, jobs
    path: service/Api/src/Shared
    layers:
      types: service/Api/src/Shared/Application
      security: service/Api/src/Shared/Security
      operational: service/Api/src/Shared/Operational
      performance: service/Api/src/Shared/Performance
      observability: service/Api/src/Shared/Observability
      governance: service/Api/src/Shared/Governance
    providers: []
    size_loc: 29612

  - name: Api.Host
    description: Thin API host — Program.cs, DI wiring, middleware pipeline, startup initialization
    path: service/Api/src/Api
    layers:
      api: service/Api/src/Api
    providers:
      - persistence
      - auth
      - observability
      - caching
      - storage
      - notifications
      - background_jobs
      - api_governance
    size_loc: 236

  - name: Api.Migrations
    description: EF Core migrations assembly — schema snapshots, migration files
    path: service/Api/src/Migrations
    layers:
      persistence: service/Api/src/Migrations
    providers:
      - persistence
    size_loc: 13357

  - name: Admin.SPA
    description: Vue 3 admin dashboard SPA — catalog management, ordering, users, inventory, reports
    path: app/Admin
    layers:
      ui: app/Admin/src
    providers:
      - auth
      - observability
    size_loc: 21861

  - name: Store.SPA
    description: Vue 3 customer-facing storefront SPA — product browsing, cart, checkout
    path: app/Store
    layers:
      ui: app/Store/src
    providers:
      - observability
    size_loc: 363

  - name: Embedding
    description: Python FastAPI ML sidecar — Fashion-CLIP image embeddings, vector search preprocessing
    path: service/Embedding
    layers:
      types: service/Embedding/src/schemas
      service: service/Embedding/src/services
      runtime: service/Embedding/src/routers
      ui: null
    providers:
      - observability
    size_loc: 277

  - name: Aspire.Orchestration
    description: Aspire AppHost — service wiring, resource orchestration, health checks, service discovery
    path: infra/Aspire
    layers:
      api: infra/Aspire/src/ReSys.AppHost
      config: infra/Aspire/src/ReSys.ServiceDefaults
    providers: []
    size_loc: 238
