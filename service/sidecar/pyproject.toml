[project]
name = "resys-inference"
version = "0.1.0"
description = "Production Inference Service"
requires-python = ">=3.11"
dependencies = [
    # Core API & Server
    "fastapi[standard]>=0.115.0",
    "uvicorn>=0.20.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.6",
    "httpx>=0.24.0",
    "slowapi>=0.1.9",
    "scalar-fastapi",
    # ML & Computer Vision
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "transformers>=4.30.0",
    "onnxruntime>=1.17.0",
    # Domain Specific (CLIP requirements)
    "ftfy",
    "regex",
    # Observability (Aspire Integration)
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-exporter-otlp>=1.30.0",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-instrumentation-logging>=0.51b0",
    # Logging & Formatting
    "python-json-logger>=2.0.0",
    "rich>=13.0.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-env>=1.5.0",
    "onnxscript", # Only needed for exporting/scripts
    "pytest-asyncio>=1.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
env_files = ".env.test"
testpaths = "tests"
addopts = "-v --tb=short"
markers = [
    "integration: marks end-to-end tests that hit the full FastAPI stack"
]
log_cli = true
log_cli_level = "WARNING"
