# ════════════════════════════════════════════════════
# Webhooks Module Documentation (YAML)
# Purpose:  Webhook subscription management and delivery
# Version:  1.0.0
# Status:   stable
# Schema:   3.0
# Updated:  2026-07-11
# ════════════════════════════════════════════════════

kind: BuildingBlockModule
id: webhooks-module
name: Module.Webhooks
version: "1.0.0"
status: stable
schema_version: "3.0"

meta:
  name: Webhooks Module
  description: >
    Webhook subscription management, delivery orchestration, and intra-module
    event bus for cross-domain integration. Provides Admin CRUD endpoints for
    webhook subscriptions (Create, Read, Update, Delete, Test) with SHA-256
    secret hashing, HTTPS-only URL validation, automatic retry and exponential
    backoff delivery, and a dev-only seeder for order.placed events.
    Module size: 643 LOC (excluding Shared Operational domain types).
  category: "Integration | E-Commerce Domain"
  stability: Stable
  dependencies:
    - name: Shared
      version: "1.0.0"
      scope: runtime

principles:
  - id: P1
    name: Thin CQRS Layer Over Shared Domain
    description: >
      Module.Webhooks owns only CQRS handlers, endpoints, and registration —
      all domain logic lives in Shared.Operational.Webhooks.
    rationale: >
      Webhook domain types are consumed by multiple modules (Ordering fires events);
      placing them in Shared prevents circular module dependencies and duplication.
  - id: P2
    name: Result Object Propagation
    description: >
      Every operation returns Result<T> or Result. Handlers check IsFailure
      immediately and short-circuit. Endpoints map results via .ToResult() / .ToPagedResult().
    rationale: >
      Consistent error handling across all 6 subscriptions features. No exceptions
      for domain logic failures.
  - id: P3
    name: Secret Hashing at Creation Only
    description: >
      Secrets are SHA-256 hashed on Create and never stored in plaintext. The
      Update feature does not accept a new secret — secret rotation requires
      Create-and-Delete.
    rationale: >
      Minimizes secret exposure surface. Webhook signatures are HMAC-verified
      at delivery time against the stored hash in Shared.

features:
  - id: F1
    name: Create Webhook Subscription
    type: core
    description: >
      Creates a new webhook subscription. Accepts event name, URL, secret (SHA-256
      hashed before storage), optional custom headers JSON, and max retries.
      Validates URL via WebhookUrlValidator (HTTPS-only, blocks private networks).
      Returns 201 Created with subscription summary.
  - id: F2
    name: Get Webhook Subscription By ID
    type: core
    description: >
      Retrieves a single webhook subscription by GUID. Returns 404 via
      WebhookSubscriptionResult.Errors.NotFound if not found.
  - id: F3
    name: List Webhook Subscriptions (Paged)
    type: core
    description: >
      Retrieves a paged list of webhook subscriptions ordered by CreatedAtUtc.
      Supports querying parameters (page, pageSize, sort, filter) via
      Shared's QueryingParameters infrastructure.
  - id: F4
    name: Update Webhook Subscription
    type: core
    description: >
      Partially updates a webhook subscription. Supports updating URL (re-validated),
      Active flag, MaxRetries, and HeadersJson. Null fields are skipped.
      Does not accept secret updates. Returns 404 if not found.
  - id: F5
    name: Delete Webhook Subscription
    type: core
    description: >
      Removes a webhook subscription by ID. Returns 204 No Content
      on success, 404 if not found.
  - id: F6
    name: Test Webhook Subscription
    type: extension
    description: >
      Sends a test payload to the subscription URL. Creates a WebhookDelivery
      record with a sample JSON payload, dispatches it via IWebhookDispatcher,
      and returns the delivery status, attempt count, and last error.

abstractions:
  - category: Domain Types
    order: 1
    description: Domain error factory for webhook subscription operations.
    items:
      - id: A1
        name: WebhookSubscriptionResult
        type: record
        path: ./Domain/WebhookSubscription.Result.cs
        description: >
          Domain error factory providing typed Error instances (NotFound)
          used by all feature handlers.
        purpose: >
          Centralizes error definitions for webhook subscription operations.
          Actual domain errors for validation live in Shared.Operational.Webhooks.Domain.

  - category: Feature Slices
    order: 2
    description: CQRS feature slices implementing Admin CRUD endpoints for webhook subscriptions.
    items:
      - id: B1
        name: WebhooksFeature
        type: extension
        path: ./Features/Admin/WebhooksFeature.cs
        description: >
          Central route, permission, and metadata registry for all webhook endpoints.
        purpose: >
          Single source of truth for route strings, PermissionMetadata instances,
          and OpenAPI summary/description strings. Prevents route/permission drift.
      - id: B2
        name: CreateWebhookSubscription
        type: handler
        path: ./Features/Admin/Subscriptions/Create/
        description: >
          CQRS feature slice for creating webhook subscriptions. Includes Command,
          CommandHandler, Request, Response, and Endpoint.
        purpose: >
          Accepts event, URL, secret (SHA-256 hashed), headers, maxRetries.
          Validates URL via Shared validator, creates via WebhookSubscriptionMethod.
      - id: B3
        name: GetWebhookSubscriptionById
        type: handler
        path: ./Features/Admin/Subscriptions/Get/ById/
        description: >
          CQRS feature slice for retrieving a single webhook subscription by ID.
        purpose: >
          Returns full subscription details (including HeadersJson, timestamps).
          Returns 404 if not found.
      - id: B4
        name: GetWebhookSubscriptions
        type: handler
        path: ./Features/Admin/Subscriptions/Get/Paged/
        description: >
          CQRS feature slice for paged listing of webhook subscriptions.
        purpose: >
          Supports Shared's QueryingParameters for pagination, sorting, filtering.
          Uses IPagedQueryHandler / PagedResult pattern.
      - id: B5
        name: UpdateWebhookSubscription
        type: handler
        path: ./Features/Admin/Subscriptions/Update/
        description: >
          CQRS feature slice for partial update of a webhook subscription.
        purpose: >
          Supports partial updates: URL, Active, MaxRetries, HeadersJson. Null fields
          are skipped. Re-validates URL on change. Returns 404 if not found.
      - id: B6
        name: DeleteWebhookSubscription
        type: handler
        path: ./Features/Admin/Subscriptions/Delete/
        description: >
          CQRS feature slice for deleting a webhook subscription.
        purpose: >
          Removes subscription from database. Returns 204 No Content on success,
          404 if not found.
      - id: B7
        name: TestWebhookSubscription
        type: handler
        path: ./Features/Admin/Subscriptions/Test/
        description: >
          CQRS feature slice for testing a webhook subscription by sending a sample
          payload via IWebhookDispatcher.
        purpose: >
          Creates WebhookDelivery with test payload, dispatches immediately,
          returns delivery status, attempt count, and last error.

  - category: Infrastructure
    order: 3
    description: Module registration and data seeding infrastructure.
    items:
      - id: C1
        name: WebhooksExtension
        type: extension
        path: ./Webhooks.Extension.cs
        description: >
          Module registration extension method for the application builder.
        purpose: >
          Called by the Api host during startup. Registers the dev-only
          WebhookSubscriptionSeeder via builder.AddSeeder<T>().
      - id: C2
        name: WebhookSubscriptionSeeder
        type: class
        path: ./Persistence/Seeders/WebhookSubscription.Seeder.cs
        description: >
          Dev-only data seeder for an order.placed webhook subscription.
        purpose: >
          Seeds a single webhook subscription (order.placed to http://localhost:9999/webhook)
          for development/testing. Marked as TEMP — remove before production.

technical:
  mechanisms:
    - id: M1
      name: Webhook URL Validation
      scope: Create and Update feature handlers
      description: >
        Incoming webhook URLs are validated via Shared.Operational.Webhooks.Domain.WebhookUrlValidator.
        Enforces HTTPS-only scheme, blocks private network IP ranges (10.x, 172.16-31.x, 192.168.x,
        127.x, 169.254.x), blocks specific hostnames (127.0.0.1, 0.0.0.0, 169.254.169.254),
        and limits URL length to 2048 characters.
    - id: M2
      name: SHA-256 Secret Hashing
      scope: Create feature handler
      description: >
        The Create handler hashes the provided secret using SHA256.HashData and stores
        the hex-encoded hash on the WebhookSubscription entity. The hash is used by
        Shared's WebhookSigner to generate HMAC-SHA256 signatures on delivery payloads.
    - id: M3
      name: Webhook Delivery Pipeline
      scope: Test feature handler and Shared background service
      description: >
        Webhooks uses Shared's IWebhookDispatcher to deliver payloads. The Test handler
        creates a WebhookDelivery record and calls dispatcher.DeliverAsync() immediately.
        Production deliveries flow through Shared's WebhookDeliveryJob (background service)
        which queries pending/failed deliveries, builds HMAC signatures, POSTs to
        subscriber URLs, and manages retry with exponential backoff.

anti_patterns:
  - id: AP1
    name: Domain Logic in Module
    severity: high
    avoid: >
      Adding domain entity classes, factory methods (WebhookSubscriptionMethod),
      validation logic (WebhookUrlValidator), or delivery logic directly in
      Module.Webhooks.
    better_approach: >
      All webhook domain logic lives in Shared.Operational.Webhooks.Domain.
      Module.Webhooks owns only the feature handlers, endpoints, and module
      registration. This enables cross-module consumption (e.g., Ordering fires
      webhook events) without circular dependencies.
  - id: AP2
    name: Hardcoded Dev Secrets
    severity: medium
    avoid: >
      The dev seeder (WebhookSubscriptionSeeder) contains a hardcoded SHA-256
      hash and posts to http://localhost:9999/webhook. The validator rejects
      non-HTTPS URLs, but the seeder bypasses validation.
    better_approach: >
      Marked as TEMP — remove before production. Replace with real configuration
      injected through the module registration.

usage:
  scenarios:
    - id: S1
      title: Creating a New Webhook Subscription
      context: >
        An admin needs to configure a webhook to receive order.placed events
        at https://hooks.example.com/orders.
      pattern: |
        POST /api/webhooks/subscriptions
        {
          "event": "order.placed",
          "url": "https://hooks.example.com/orders",
          "secret": "my-verification-secret",
          "maxRetries": 5
        }
      benefits:
        - URL validated against private networks and HTTPS requirements
        - Secret automatically SHA-256 hashed before storage
        - Returns 201 with subscription ID, event, URL, active status, maxRetries
    - id: S2
      title: Testing a Webhook Delivery
      context: >
        After creating a subscription, the admin wants to verify the endpoint
        receives and processes deliveries correctly.
      pattern: |
        POST /api/webhooks/subscriptions/{id}/test
      benefits:
        - Creates a real WebhookDelivery record in the database
        - Dispatches immediately via IWebhookDispatcher
        - Returns delivery status, attempt count, and last error for debugging
    - id: S3
      title: Listing and Updating Subscriptions
      context: >
        An admin reviews all subscriptions and disables an outdated one.
      pattern: |
        GET /api/webhooks/subscriptions?page=1&pageSize=20
        PUT /api/webhooks/subscriptions/{id}
        { "active": false }
      benefits:
        - Paged listing with sorting/filtering via QueryingParameters
        - Partial update — only specified fields are modified
        - URL re-validated on update if changed

testing:
  strategies:
    - id: TS1
      title: Feature Handler Unit Tests
      objective: >
        Each CommandHandler/QueryHandler should be unit-tested with mocked
        IApplicationDbContext. Cover: successful operation, not-found paths,
        validation failure propagation from Shared validators.
    - id: TS2
      title: URL Validation Integration
      objective: >
        Verify WebhookUrlValidator rules propagate correctly through the handler:
        HTTPS-only, private IP block, empty URL, too-long URL.

file_structure: |
  Webhooks/
  ├── Domain/
  │   └── WebhookSubscription.Result.cs       # Domain error factory (NotFound)
  ├── Features/
  │   └── Admin/
  │       ├── WebhooksFeature.cs              # Route, permission, metadata registry
  │       └── Subscriptions/
  │           ├── Create/                     # Command, Handler, Request, Response, Endpoint
  │           ├── Delete/                     # Command, Handler, Endpoint
  │           ├── Get/
  │           │   ├── ById/                   # Query, Handler, Response, Endpoint
  │           │   └── Paged/                  # Query, PagedQueryHandler, Response, Endpoint
  │           ├── Test/                       # Command, Handler, Response, Endpoint
  │           └── Update/                     # Command, Handler, Request, Response, Endpoint
  ├── Persistence/
  │   └── Seeders/
  │       └── WebhookSubscription.Seeder.cs   # Dev-only order.placed seeder
  ├── Webhooks.Extension.cs                   # Module registration entry point
  └── README.yaml                             # This documentation
