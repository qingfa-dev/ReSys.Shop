kind: BuildingBlockModule
id: payment
name: Module.Payment
version: "1.0.0"
status: active
schema_version: "3.0"

meta:
  description: >
    Payment processing module managing the full payment lifecycle: payment
    intents, captures, refunds, voids, gateway integration (Stripe and Bogus
    offline), and webhook handling. Core entity is PaymentCapture (state-machine
    driven, ported from Spree::Payment architecture). Gateway implementations
    live under Services/Provider/ with a GatewayRegistry for multi-provider
    switching. Domain enforces state machine transitions via
    PaymentCapture.Method.State.cs.
  domain: payment
  size_loc: 4431
  layer: business
  dependencies:
    external:
      - Stripe.net
      - EntityFrameworkCore
      - Carter
      - MediatR
      - FluentValidation
      - Mapster
  providers:
    - persistence
    - auth
    - observability
  tags:
    - payment
    - gateway
    - stripe
    - checkout

principles:
  - id: P-1
    name: Gateway Abstraction
    description: >
      All gateway operations go through IPaymentGatewayActionProvider. Concrete
      providers (StripeGateway, BogusGateway) live in Services/Provider/.
      Domain never references provider implementations directly.
    rationale: Enables swapping payment providers without touching domain logic.
  - id: P-2
    name: State Machine Integrity
    description: >
      PaymentCapture follows a strict state machine:
      Checkout->Processing->Pending->Completed or ->Failed->Void->Invalid.
      Every transition is enforced by the domain model; features never bypass
      state validation.
    rationale: Prevents illegal state transitions that could corrupt financial records.
  - id: P-3
    name: Result-Based Error Handling
    description: >
      All domain operations return Result<T> or Result. Exceptions are only
      used for unrecoverable infrastructure failures (e.g., StripeException
      in gateway adapters). Business errors use typed Error objects.
    rationale: Makes failure paths explicit and testable without exception control flow.
  - id: P-4
    name: GatewayRegistry Provider Selection
    description: >
      Gateway selection uses IGatewayRegistry which resolves the registered
      IPaymentGatewayActionProvider by provider type. Stripe and Bogus are
      both registered; the registry selects based on PaymentMethod.ProviderType
      at runtime, not a global UseBogusGateway flag.
    rationale: Enables per-payment-method gateway selection rather than global toggle.
  - id: P-5
    name: Idempotency by Default
    description: >
      GatewayOptions includes an IdempotencyKey derived from the payment
      number. All gateway calls forward this key to prevent duplicate
      charges on retry.
    rationale: Stripe and other gateways support idempotency keys to avoid double-processing.

features:
  - id: F-1
    name: CreatePaymentIntent
    type: command
    layer: storefront
    description: >
      Creates a payment for an order, persists a PaymentCapture in Checkout
      state, then delegates to the gateway for authorize or purchase based
      on the payment method's AutoCapture setting. Returns client secret
      for frontend confirmation. Coordinates with Ordering module via ISender.
    path: ./Features/Storefront/Payment/CreateIntent
    tags: [storefront, payment, intent]
  - id: F-2
    name: ConfirmPayment
    type: command
    layer: storefront
    description: >
      Confirms a payment transitioning from Processing or Pending to Completed.
      Validates ownership via ICurrentUser and enforces state preconditions.
    path: ./Features/Storefront/Payment/Confirm
    tags: [storefront, payment, confirm]
  - id: F-3
    name: CreateSetupIntent
    type: command
    layer: storefront
    description: >
      Creates a Stripe SetupIntent for saving a payment method for future
      use. Directly calls Stripe API via SetupIntentService.
    path: ./Features/Storefront/Payment/SetupIntent
    tags: [storefront, payment, setup-intent, stripe]
  - id: F-4
    name: ListPaymentMethods
    type: query
    layer: storefront
    description: >
      Returns active, non-deleted payment methods for the storefront. Supports
      paging, sorting, and filtering via QueryingParameters.
    path: ./Features/Storefront/Payment/Methods
    tags: [storefront, payment-method, read]
  - id: F-5
    name: StripeWebhook
    type: command
    layer: storefront
    description: >
      Receives Stripe webhook events, validates the signature via
      IStripeWebhookService, and enqueues ProcessStripeWebhookEventJob
      which routes by event type: checkout.session.completed,
      checkout.session.expired, payment_intent.succeeded, payment_intent.payment_failed,
      payment_intent.canceled, charge.refunded, charge.dispute.created.
    path: ./Features/Storefront/Payment/Webhooks
    tags: [storefront, webhook, stripe]
  - id: F-6
    name: GetPagedPayments
    type: query
    layer: admin
    description: >
      Retrieves a paged list of payments for the admin panel with sorting
      and filtering by state, payment method, and order.
    path: ./Features/Admin/Payments/Get/Paged
    tags: [admin, payment, read, paging]
  - id: F-7
    name: GetPaymentById
    type: query
    layer: admin
    description: >
      Retrieves a single payment with full detail including response code,
      intent client secret, and audit timestamps.
    path: ./Features/Admin/Payments/Get/ById
    tags: [admin, payment, read]
  - id: F-8
    name: CapturePayment
    type: command
    layer: admin
    description: >
      Captures a previously authorized payment via the gateway. Supports
      partial captures — defaults to uncaptured amount when not specified.
    path: ./Features/Admin/Payments/Capture
    tags: [admin, payment, capture]
  - id: F-9
    name: VoidPayment
    type: command
    layer: admin
    description: >
      Voids an authorized payment before settlement via the gateway.
      Transitions the payment to Void state.
    path: ./Features/Admin/Payments/Void
    tags: [admin, payment, void]
  - id: F-10
    name: RefundPayment
    type: command
    layer: admin
    description: >
      Refunds a captured payment via the gateway. Currently refunds the full
      captured amount; partial refund is deferred to v1.x.
    path: ./Features/Admin/Payments/Refund
    tags: [admin, payment, refund]
  - id: F-11
    name: CreatePaymentMethod
    type: command
    layer: admin
    description: >
      Creates a new payment method with name, code, provider type, display
      preferences, and optional gateway configuration.
    path: ./Features/Admin/PaymentMethods/Create
    tags: [admin, payment-method, create]
  - id: F-12
    name: GetPagedPaymentMethods
    type: query
    layer: admin
    description: >
      Retrieves a paged list of payment methods ordered by position and name.
      Supports paging, sorting, and filtering.
    path: ./Features/Admin/PaymentMethods/Get/Paged
    tags: [admin, payment-method, read, paging]
  - id: F-13
    name: GetPaymentMethodById
    type: query
    layer: admin
    description: >
      Retrieves a single payment method with full detail.
    path: ./Features/Admin/PaymentMethods/Get/ById
    tags: [admin, payment-method, read]
  - id: F-14
    name: UpdatePaymentMethod
    type: command
    layer: admin
    description: >
      Updates an existing payment method's properties including name, code,
      provider type, display preferences, and gateway configuration.
    path: ./Features/Admin/PaymentMethods/Update
    tags: [admin, payment-method, update]
  - id: F-15
    name: ActivatePaymentMethod
    type: command
    layer: admin
    description: >
      Activates a previously deactivated payment method, making it available
      for storefront and admin use again.
    path: ./Features/Admin/PaymentMethods/Activate
    tags: [admin, payment-method, activate]
  - id: F-16
    name: DeactivatePaymentMethod
    type: command
    layer: admin
    description: >
      Deactivates a payment method by setting Active to false. The method
      is not deleted and can be reactivated.
    path: ./Features/Admin/PaymentMethods/Deactivate
    tags: [admin, payment-method, deactivate]
  - id: F-17
    name: DeletePaymentMethod
    type: command
    layer: admin
    description: >
      Soft-deletes a payment method via ISoftDeletable. The method is
      marked as deleted but retained in the database.
    path: ./Features/Admin/PaymentMethods/Delete
    tags: [admin, payment-method, delete]
  - id: F-18
    name: VoidOrderPayments
    type: command
    layer: shared
    description: >
      Cross-feature command used by Ordering module to void all payments
      for a cancelled order. Dispatched via ISender, not direct reference.
    path: ./Features/Shared/Commands/VoidOrderPayments
    tags: [shared, payment, void, ordering]

abstractions:
  - id: A-1
    name: PaymentCapture
    type: entity
    path: ./Domain/PaymentCaptures/PaymentCapture.cs
    description: >
      Core domain entity representing a payment transaction. Manages state
      transitions, amounts, gateway response data, and audit fields.
    purpose: >
      Tracks the full lifecycle of a payment from checkout through completion,
      failure, or void. Partial class split across Constant, Enumerate, Loggers,
      Method.Factory, Method.State, Result, and Validation files.
    properties:
      - Number (string) — unique payment identifier
      - Amount (decimal) — payment amount
      - State (PaymentRecordState) — current lifecycle state
      - ResponseCode (string?) — gateway authorization code
      - IntentClientSecret (string?) — Stripe client secret for frontend
      - PaymentMethodId (Guid?) — FK to payment method (nullable)
      - OrderId (Guid) — FK to order
      - RefundedAmount (decimal) — total refunded amount
  - id: A-2
    name: PaymentRecordState
    type: enum
    path: ./Domain/PaymentCaptures/PaymentCapture.Enumerate.cs
    description: >
      Enumerates all payment lifecycle states: Checkout, Processing, Pending,
      Completed, Failed, Void, Invalid.
    purpose: >
      Defines the valid states for the payment state machine. Transitions
      are enforced by PaymentCapture.Method.State.cs.
    values:
      - Checkout — initial state at creation
      - Processing — gateway submission in progress
      - Pending — authorized, awaiting capture
      - Completed — fully captured or purchased
      - Failed — declined or error from gateway
      - Void — cancelled before settlement
      - Invalid — terminal state for unrecoverable payments
  - id: A-3
    name: PaymentMethod
    type: entity
    path: ./Domain/PaymentMethods/PaymentMethod.cs
    description: >
      Represents a payment method (e.g., credit card, PayPal, bank transfer)
      with provider configuration, display preferences, and soft-deletion.
    purpose: >
      Configures how payments are processed. Each method has a ProviderType
      that maps to a gateway implementation via GatewayRegistry.
    properties:
      - Name (string) — display name
      - Code (string?) — machine-readable code
      - ProviderType (string) — gateway provider type identifier
      - Active (bool) — whether the method is available
      - AutoCapture (bool) — whether payments auto-capture
      - DisplayOn (DisplayOn) — visibility target
      - Preferences (Dictionary) — gateway-specific key-value config
  - id: A-4
    name: DisplayOn
    type: enum
    path: ./Domain/PaymentMethods/PaymentMethod.Enumerate.cs
    description: >
      Controls where a payment method is displayed: Both, Frontend, Backend.
    purpose: >
      Filters payment methods for storefront vs admin contexts.
  - id: A-5
    name: IPaymentGatewayActionProvider
    type: interface
    path: ./Services/Abstractions/IPaymentGatewayActionProvider.cs
    description: >
      Defines the contract for all gateway operations: Authorize, Capture,
      Purchase, Void, Cancel, Credit. Also exposes AutoCapture, SourceRequired,
      and PaymentProfilesSupported properties.
    purpose: >
      Domain abstraction that decouples payment processing from concrete
      gateway implementations. Concrete providers register via DI in
      PaymentExtension.
  - id: A-6
    name: IGatewayRegistry
    type: interface
    path: ./Services/Abstractions/IGatewayRegistry.cs
    description: >
      Resolves an IPaymentGatewayActionProvider by provider type string.
      Used by feature handlers to select the correct gateway for a payment
      method at runtime.
    purpose: >
      Enables per-payment-method gateway selection. The registry holds
      all registered providers and dispatches based on ProviderType.
  - id: A-7
    name: GatewayRegistry
    type: class
    path: ./Services/Provider/GatewayRegistry.cs
    description: >
      Implementation of IGatewayRegistry. Receives all registered
      IPaymentGatewayActionProvider instances via DI and selects by
      matching provider type key.
    purpose: >
      Concrete registry that maps provider type strings to gateway
      implementations. Registered in PaymentExtension.
  - id: A-8
    name: IPaymentProcessingService
    type: interface
    path: ./Services/Abstractions/IPaymentProcessingService.cs
    description: >
      Orchestrates the full payment processing workflow: create capture,
      delegate to gateway, handle response, update state. Used by
      CreatePaymentIntent and other storefront features.
    purpose: >
      Single service for payment processing orchestration, separating
      workflow logic from handler orchestration.
  - id: A-9
    name: PaymentProcessingService
    type: class
    path: ./Services/Processing/PaymentProcessingService.cs
    description: >
      Implementation of IPaymentProcessingService. Handles gateway
      delegation, state transitions, and audit logging.
    purpose: >
      Concrete implementation that bridges feature handlers with domain
      entities and gateway abstractions.
  - id: A-10
    name: Gateway (abstract)
    type: abstract-class
    path: ./Services/Abstractions/Gateway.cs
    description: >
      Abstract base class implementing IPaymentGatewayActionProvider.
      Provides common gateway behavior and currency conversion
      (FromDollarToCentRate).
    purpose: >
      Common base for StripeGateway and BogusGateway. Handles shared
      gateway configuration and unit conversion.
  - id: A-11
    name: PaymentGatewayResponse
    type: record
    path: ./Services/Models/PaymentGatewayResponse.cs
    description: >
      Immutable response wrapper from gateway operations. Contains Success,
      Message, Authorization code, AVS/CVV results, and raw params.
    purpose: >
      Standardized response type returned by all gateway actions. Feature
      handlers inspect Success and Authorization to determine state transitions.
  - id: A-12
    name: PaymentProcessingResult
    type: record
    path: ./Services/Models/PaymentProcessingResult.cs
    description: >
      Result wrapper returned by PaymentProcessingService. Contains the
      PaymentCapture, gateway response, and any business errors.
    purpose: >
      Aggregates the payment outcome (capture + gateway response) for
      handler-level decision making.
  - id: A-13
    name: GatewayOptions
    type: class
    path: ./Services/Models/GatewayOptions.cs
    description: >
      Options hash sent to payment gateways. Contains email, customer,
      order/payment identifiers, idempotency key, and optional billing/
      shipping addresses.
    purpose: >
      Encapsulates all metadata needed by gateways to process a payment.
  - id: A-14
    name: StripeGateway
    type: class
    path: ./Services/Provider/Stripe/StripeGateway.cs
    description: >
      Stripe payment gateway implementation. Handles PaymentIntent creation,
      capture, void, cancel, and refund via Stripe.net SDK. Supports
      idempotency keys and maps StripeException to typed errors.
    purpose: >
      Production payment gateway for live Stripe integration.
  - id: A-15
    name: BogusGateway
    type: class
    path: ./Services/Provider/Bogus/BogusGateway.cs
    description: >
      Offline payment gateway for local development. Uses deterministic test
      card numbers (4242424242424242 for success, 4000000000000002 for decline).
      No external network calls.
    purpose: >
      Enables payment flow testing without Stripe sandbox dependency.
      Registered alongside StripeGateway — selected by per-payment-method
      provider type.
  - id: A-16
    name: StripeOptions
    type: class
    path: ./Services/Models/StripeOptions.cs
    description: >
      Configuration POCO for Stripe: SecretKey, WebhookSecret, PublishableKey.
      Bound from the "Stripe" configuration section via IOptions<StripeOptions>.
    purpose: >
      Stripe gateway configuration binding.
  - id: A-17
    name: BogusOptions
    type: class
    path: ./Services/Models/BogusOptions.cs
    description: >
      Configuration POCO for BogusGateway: Enabled flag. Section name is
      "Payment:Providers:Bogus".
    purpose: >
      Bogus gateway configuration binding.
  - id: A-18
    name: GatewayProvidersOptions
    type: class
    path: ./Services/Configuration/GatewayProvidersOptions.cs
    description: >
      Configuration POCO for the full gateway provider section.
      Section name is "Payment:Providers".
    purpose: >
      Top-level options class for the Payment:Providers config section,
      containing Stripe and Bogus sub-configurations.
  - id: A-19
    name: GatewayConstants
    type: static-class
    path: ./Services/Models/GatewayConstants.cs
    description: >
      Constant provider type strings and default gateway configuration keys.
    purpose: >
      Single source of truth for gateway provider identifiers used by
      GatewayRegistry and PaymentMethod configuration.
  - id: A-20
    name: StripeWebhookDispatcher
    type: class
    path: ./Features/Storefront/Payment/Webhooks/StripeWebhookDispatcher.cs
    description: >
      Validates Stripe webhook signatures and parses event payloads. Uses
      StripeSetting.WebhookSecret for signature verification.
    purpose: >
      Security layer for Stripe webhook processing. Prevents forged
      webhook events from affecting payment state.
  - id: A-21
    name: IStripeWebhookService
    type: interface
    path: ./Services/Webhook/IStripeWebhookService.cs
    description: >
      Contract for Stripe webhook signature validation and event parsing.
    purpose: >
      Abstraction enabling testable webhook processing.
  - id: A-24
    name: PaymentExtension
    type: static-class
    path: ./Payment.Extension.cs
    description: >
      DI registration entry point for the Payment module. Registers
      all gateway providers, registry, services, webhook handlers,
      and PaymentMethodSeeder.
    purpose: >
      Composition root for the module. Called from Program.cs via
      builder.AddPaymentModule().
  - id: A-25
    name: PaymentRecordConfiguration
    type: class
    path: ./Persistence/Configurations/Payments/PaymentRecordConfiguration.cs
    description: >
      EF Core entity configuration for PaymentRecord (legacy, retained
      for migration compatibility). Maps to the "payment.payment_records"
      table with decimal(18,2) amounts.
    purpose: >
      Legacy configuration retained for existing migration chain.
  - id: A-26
    name: PaymentMethodConfiguration
    type: class
    path: ./Persistence/Configurations/PaymentMethods/PaymentMethodConfiguration.cs
    description: >
      EF Core entity configuration for PaymentMethod. Maps to the
      "payment.payment_methods" table with dictionary conversion for
      Preferences column.
    purpose: >
      Defines the database schema for payment methods.
  - id: A-27
    name: PaymentSchema
    type: static-class
    path: ./Persistence/PaymentSchema.cs
    description: >
      Schema and table name constants. Schema is "payment". Table names
      are snake_cased: payment_records, payment_methods.
    purpose: >
      Single source of truth for database naming conventions.
  - id: A-28
    name: PaymentMethodSeeder
    type: class
    path: ./Persistence/Seeders/PaymentMethod.Seeder.cs
    description: >
      Seeds initial payment methods: Credit Card (autoCapture=true),
      PayPal, Bank Transfer (backend only). Runs at order 160.
    purpose: >
      Provides baseline payment methods for fresh database instances.
  - id: A-29
    name: PaymentFeature
    type: static-class
    path: ./Features/Shared
    description: >
      Route constants and permission metadata for all payment features.
      Split into Admin, Storefront, and Tags partials.
    purpose: >
      Centralized route definitions ensuring consistent API paths and
      permission checks across all payment endpoints.
  - id: A-30
    name: PaymentCaptureLoggers
    type: static-class
    path: ./Domain/PaymentCaptures/PaymentCapture.Loggers.cs
    description: >
      High-performance source-generated loggers for payment lifecycle events.
      Event IDs 3101-3105 cover Created, Completed, Voided, Failed, Captured.
    purpose: >
      Structured logging for payment operations with minimal allocation overhead.

technical:
  database:
    schema: payment
    tables:
      - name: payment_records
        entity: PaymentCapture (via PaymentRecordState enum)
        description: Stores all payment transactions
        keys:
          - column: id
            type: uuid
            constraint: primary_key
        indexes:
          - columns: [state]
          - columns: [order_id]
          - columns: [payment_method_id]
          - columns: [created_at_utc]
      - name: payment_methods
        entity: PaymentMethod
        description: Stores payment method configurations
        keys:
          - column: id
            type: uuid
            constraint: primary_key
        indexes:
          - columns: [active, is_deleted]
          - columns: [position]
  state_machine:
    entity: PaymentCapture
    states:
      - Checkout
      - Processing
      - Pending
      - Completed
      - Failed
      - Void
      - Invalid
    transitions:
      - from: Checkout
        to: Processing
      - from: Processing
        to: Pending
      - from: Processing
        to: Completed
      - from: Processing
        to: Failed
      - from: Processing
        to: Void
      - from: Pending
        to: Completed
      - from: Pending
        to: Failed
      - from: Pending
        to: Void
      - from: Failed
        to: Invalid
      - from: Void
        to: Invalid
  gateway_operations:
    - Authorize — reserve funds on payment source
    - Capture — settle previously authorized funds
    - Purchase — authorize + capture in one step
    - Void — cancel authorization before settlement
    - Cancel — void completed/captured payment
    - Credit — issue refund against captured payment
  external_integrations:
    - name: Stripe
      type: payment-gateway
      sdk: Stripe.net
      features: [payment-intents, setup-intents, webhooks, refunds]
    - name: Stripe Webhooks
      type: webhook-receiver
      events:
        - payment_intent.succeeded
        - payment_intent.payment_failed
        - charge.refunded
        - charge.dispute.created
  configuration_sections:
    - path: Stripe
      options: StripeOptions
      keys: [SecretKey, WebhookSecret, PublishableKey]
    - path: Payment:Providers:Bogus
      options: BogusOptions
      keys: [Enabled]
    - path: Payment:Providers
      options: GatewayProvidersOptions
      keys: [Stripe, Bogus]
  shared:
    - Shared.Application.Domain.Concerns.Auditable (IAuditable)
    - Shared.Application.Domain.Concerns.SoftDeletable (ISoftDeletable)
    - Shared.Application.Domain.Concerns.Parameterizable (IParameterizable)
    - Shared.Application.Domain.Models (Entity, Result, Error)
    - Shared.Operational.Persistence.Configurations.Dictionaries (DictionaryValueConverter)
    - Shared.Security.Authorization.Features (PermissionMetadata)
    - Shared.Security.Identity.Domain.Permissions

anti_patterns:
  - id: AP-1
    name: Direct Gateway Instantiation
    description: >
      Never instantiate StripeGateway or BogusGateway directly in feature
      handlers. Always inject IPaymentGatewayActionProvider or IGatewayRegistry
      via DI.
    consequence: Bypasses multi-provider selection, testing seams, and registry switching.
  - id: AP-2
    name: Bypassing State Machine
    description: >
      Never set PaymentCapture.State directly in feature handlers. Always use
      PaymentCapture.Method.State.cs transition methods or the
      PaymentProcessingService that enforces preconditions.
    consequence: Creates inconsistent payment states and violates invariants.
  - id: AP-3
    name: Skipping Idempotency Keys
    description: >
      Always include an IdempotencyKey in GatewayOptions when calling
      gateway operations. Use the pattern "spree-{payment.Number}".
    consequence: Duplicate charges may occur on network retries.
  - id: AP-4
    name: Exception-Based Error Handling
    description: >
      Domain operations must return Result objects, not throw exceptions.
      Catch StripeException only in gateway adapter classes and map to
      typed Error objects.
    consequence: Exceptions bypass the Result pattern and make failures invisible to callers.

usage:
  registration: |
    // Program.cs
    builder.AddPaymentModule();
  gateway_selection: |
    // GatewayRegistry resolves provider by PaymentMethod.ProviderType
    var gateway = await gatewayRegistry.GetAsync(paymentMethod.ProviderType);
    var response = await gateway.AuthorizeAsync(amount, options);
  feature_invocation: |
    // Create payment intent (storefront)
    var result = await sender.Send(new CreatePaymentIntent.Command(orderId));

    // Capture payment (admin)
    var result = await sender.Send(new CapturePayment.Command(id, request));

    // Void order payments (shared — called by Ordering module)
    var result = await sender.Send(new VoidOrderPayments.Command(orderId));
  webhook_registration: |
    // Stripe webhook endpoint
    app.MapPost("/api/admin/payments/stripe/webhook", async (string payload, string stripeSignature) =>
    {
        var result = await sender.Send(new StripeWebhook.Command(payload, stripeSignature));
        return result.IsSuccess ? Results.Ok() : Results.BadRequest(result.Errors);
    });
  state_transitions: |
    // State transitions via PaymentCapture domain methods
    payment.Process();     // Checkout -> Processing
    payment.Complete();    // Processing/Pending -> Completed
    payment.Fail();        // Checkout/Processing/Pending -> Failed
    payment.Void();        // Processing/Pending -> Void

    // Processing via PaymentProcessingService
    var result = await paymentProcessingService.ProcessPaymentAsync(capture, gateway, options);

