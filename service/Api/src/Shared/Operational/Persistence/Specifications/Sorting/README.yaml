# Sorting Module

## Purpose

Define, parse, validate, and apply sort specifications to entity queries.
The `SortModel` is an immutable, validated representation of an ordered list
of sort clauses. Each clause specifies a field name, direction (ascending/descending),
and optional null-placement rule.

## Principles

1. **Immutable model** — `SortModel` and `SortClause` are immutable after construction.
2. **Fail-safe validation** — Invalid fields populate `Violations` and cause `IsValid=false`;
   the caller decides how to handle them. No exceptions during parsing/validation.
3. **Three input surfaces** — DSL string (`Name asc, CreatedAt desc`), JSON array,
   and query-string parameters produce the same `SortModel` shape.
4. **Internal construction** — `SortModel` constructor is `internal`. Construction
   is only permitted via `SortModelExtensions` factory methods or parsers.
5. **Optionally-allowed enforcement** — An optional `AllowedFields` whitelist
   (via `IReadOnlySet<string>`) validates field references post-parse.

## Anti-Patterns

- **Do NOT construct `SortModel` directly** — Use `SortModelExtensions.FromString`,
  `FromJson`, or `FromQueryString` factory methods.
- **Do NOT bypass `AllowedFields`** — Always pass the entity's allowed sort fields
  when the input comes from an untrusted source (e.g., query string).
- **Do NOT mutate** — All types are immutable. Create new instances when changes are needed.

