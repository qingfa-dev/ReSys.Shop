## Usage

```cs
// From DSL string
Result<SortModel> result = SortModelExtensions.FromString("Name asc, CreatedAt desc", allowedFields);

// From JSON
Result<SortModel> result = SortModelExtensions.FromJson("""[{"field":"Name"},{"field":"CreatedAt","direction":"desc"}]""");

// From query string
Result<SortModel> result = SortModelExtensions.FromQueryString(httpContext.Request.Query["sort"]);

// Apply to IQueryable
IQueryable<Product> sorted = dbContext.Products.ApplySort(result.Value);
```

