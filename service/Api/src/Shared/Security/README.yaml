  │   ├── Attributes/                              # HasPermission attribute
  │   ├── Features/                                # 10 FeatureMetadata classes
  │   ├── Options/
  │   │   ├── AuthzSetting.cs
  │   │   ├── AuthzSetting.Constant.cs
  │   │   ├── AuthzSetting.Result.cs
