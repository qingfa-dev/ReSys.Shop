  │       │   ├── JwtSetting.Constant.cs
  │       │   ├── JwtSetting.Result.cs
  │       │   └── JwtSetting.Validator.cs
  │       └── Services/
  │           ├── Access/                           # IAccessTokenService
  │           └── Refresh/                          # IRefreshTokenService + Store + Protections
  ├── Authorization/
