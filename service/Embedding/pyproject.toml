[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "embedding"
version = "0.1.0"
description = "Embedding generation service for ReSys.Shop"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "torch>=2.0",
    "torchvision>=0.18",          # ResNet-50, image transforms
    "open-clip-torch>=1.0",        # Fashion-CLIP
    "timm>=1.0",                   # EfficientNet-B0
    "transformers>=4.40",          # CLIP-generic (HuggingFace)
    "pillow>=10.0",                # Image processing
    "numpy>=1.26",
    "python-multipart>=0.0.32",
    "psutil>=5.9",                 # Memory/CPU telemetry for evaluation
]

[tool.setuptools.package-dir]
"embedding" = "src"

[tool.setuptools]
packages = [
    "embedding",
    "embedding.config",
    "embedding.controllers",
    "embedding.dependencies",
    "embedding.infra",
    "embedding.infra.cache",
    "embedding.infra.models",
    "embedding.infra.preprocessing",
    "embedding.infra.storage",
    "embedding.infra.utils",
    "embedding.middleware",
    "embedding.models",
    "embedding.routers",
    "embedding.schemas",
    "embedding.services",
    "embedding.services.gateways",
    "embedding.utils",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.28",
    "ruff>=0.15.20",
]
